<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18151D"/>
      <stop offset="100%" stop-color="#0A0A0E"/>
    </linearGradient>

    <!-- Subtle Orange Glow Rim -->
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8904" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#FF8904" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Signature Orange Cursor Gradient -->
    <linearGradient id="orangeCursor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAE4A"/>
      <stop offset="100%" stop-color="#FF7400"/>
    </linearGradient>

    <!-- Ambient Glow behind the orange cursor -->
    <radialGradient id="cursorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8904" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF8904" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Rounded Squircle Badge for Universal Tab Contrast -->
  <rect width="64" height="64" rx="16" fill="url(#termBg)"/>
  <rect width="61.6" height="61.6" x="1.2" y="1.2" rx="14.8" fill="none" stroke="url(#termBorder)" stroke-width="1.2"/>

  <!-- Soft Ambient Glow behind Cursor -->
  <circle cx="42" cy="41" r="16" fill="url(#cursorGlow)"/>

  <!-- Terminal Chevron > in Crisp White -->
  <path d="M 16.5 20 L 29.5 32 L 16.5 44"
        stroke="#FFFFFF"
        stroke-width="5.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Terminal Underscore Cursor _ in Signature Orange -->
  <rect x="35" y="39.5" width="14" height="4.5" rx="2.25" fill="url(#orangeCursor)"/>
</svg>